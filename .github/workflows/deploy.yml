name: Deploy to Zenbox via SSH Key

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SFTP_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SFTP_HOST }}
          REMOTE_USER: ${{ secrets.SFTP_USER }}
          REMOTE_PORT: 22
          TARGET: domains/marcinpocwiardowski.com/public_html/
          SOURCE: ./site/
          ARGS: "-rlgoDzvc -i --delete"
          # /kurs-archetypy/ CAŁE wykluczone 04 IX 2026: hosting wideo (YouTube
          # vs Bunny vs Vimeo) świadomie nierozstrzygnięty — Marcin: „kurs jest
          # ważny [nie ruszać], tylko strona [ma jechać]". Zostaje pod
          # wgraj-kurs.sh jak dotychczas, dopóki decyzja nie padnie (patrz
          # kurs-archetypy/STAN_PROJEKTU.md → „A6 — hosting wideo").
          # mail-config.php i mailchimp-config.php: prawdziwe klucze, wgrywane
          # ręcznie raz na serwer, poza gitem. W EXCLUDE muszą być nie po to,
          # żeby ich nie wysłać (nie ma ich w repo), tylko żeby --delete ich
          # nie SKASOWAŁ z serwera przy każdym deployu.
          EXCLUDE: "/mail-config.php, /mailchimp-config.php, /kurs-archetypy/"
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=no"
