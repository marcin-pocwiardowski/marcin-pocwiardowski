name: Deploy to Zenbox via SSH Key

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SFTP_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SFTP_HOST }}
          REMOTE_USER: ${{ secrets.SFTP_USER }}
          REMOTE_PORT: 22
          TARGET: domains/marcinpocwiardowski.com/public_html/
          SOURCE: ./site/
          ARGS: "-rlgoDzvc -i --delete"
          EXCLUDE: "/mail-config.php, /kurs-archetypy/materialy-k7m3x9qp/dane/, /kurs-archetypy/materialy-k7m3x9qp/dozwolone.txt"
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=no"
